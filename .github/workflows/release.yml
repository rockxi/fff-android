name: Android Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Restore release signing key
        env:
          FFF_KEYSTORE_BASE64: ${{ secrets.FFF_KEYSTORE_BASE64 }}
        run: printf '%s' "$FFF_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/fff-release.jks"
      - name: Verify and build signed APK
        env:
          ORG_GRADLE_PROJECT_FFF_RELEASE_STORE_FILE: ${{ runner.temp }}/fff-release.jks
          ORG_GRADLE_PROJECT_FFF_RELEASE_STORE_PASSWORD: ${{ secrets.FFF_RELEASE_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_FFF_RELEASE_KEY_ALIAS: ${{ secrets.FFF_RELEASE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_FFF_RELEASE_KEY_PASSWORD: ${{ secrets.FFF_RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest lintRelease assembleRelease
      - name: Prepare release assets
        run: |
          cp app/build/outputs/apk/release/app-release.apk "fff-${GITHUB_REF_NAME}.apk"
          sha256sum "fff-${GITHUB_REF_NAME}.apk" > "fff-${GITHUB_REF_NAME}.apk.sha256"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "fff-${GITHUB_REF_NAME}.apk" "fff-${GITHUB_REF_NAME}.apk.sha256" --verify-tag --generate-notes --title "FFF ${GITHUB_REF_NAME}"
